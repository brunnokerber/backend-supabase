name: Deploy Supabase to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SITE_URL: ${{ vars.SITE_URL || 'https://peludinhosdovale.vercel.app' }}
  APP_NAME: ${{ vars.APP_NAME || 'Peludinhos do Vale' }}
  APP_DESCRIPTION: ${{ vars.APP_DESCRIPTION || 'Sistema de Gestão Animal & Resgates' }}

jobs:
  # ==========================================
  # ETAPA 1: Migrações do Banco de Dados
  # ==========================================
  deploy-database:
    name: 1. Deploy Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations to Supabase cloud
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

  # ==========================================
  # ETAPA 2: Deploy das Edge Functions
  # ==========================================
  deploy-functions:
    name: 2. Deploy Edge Functions
    needs: deploy-database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  # ==========================================
  # ETAPA 3: Sincronização de Auth & E-mail
  # ==========================================
  sync-auth-and-templates:
    name: 3. Sync Auth & Email Templates
    needs: deploy-database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sincronizar via Supabase Management API
        run: |
          node -e '
          const fs = require("fs");

          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const siteUrl = (process.env.SITE_URL || "https://peludinhosdovale.vercel.app").replace(/\/$/, "");
          const appName = process.env.APP_NAME || "Peludinhos do Vale";
          const appDesc = process.env.APP_DESCRIPTION || "Sistema de Gestão Animal & Resgates";

          let inviteHtml = fs.readFileSync("supabase/templates/invite.html", "utf8");
          inviteHtml = inviteHtml
            .replaceAll("{{APP_NAME}}", appName)
            .replaceAll("{{APP_DESCRIPTION}}", appDesc);

          async function patchConfig(body) {
            const res = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/config/auth`, {
              method: "PATCH",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(20000)
            });
            const text = await res.text();
            return { status: res.status, body: text };
          }

          async function run() {
            console.log("🔄 Sincronizando Auth e Templates com Supabase...");
            
            // 1. Tenta sincronizar URLs + Templates de E-mail
            const fullPayload = {
              site_url: siteUrl,
              uri_allow_list: `${siteUrl}/**,http://localhost:4200/**,http://127.0.0.1:4200/**`,
              mailer_subjects_invite: `Convite de Acesso - ${appName}`,
              mailer_templates_invite_content: inviteHtml
            };

            const res = await patchConfig(fullPayload);

            if (res.status >= 200 && res.status < 300) {
              console.log("✅ URLs e Template de E-mail sincronizados com sucesso!");
              return;
            }

            // 2. Se for a limitação do Free Tier sem Custom SMTP
            if (res.body.includes("Email template modification is not available for free tier")) {
              console.warn("⚠️ Aviso: Customização de template de e-mail requer Custom SMTP no Free Tier do Supabase.");
              console.log("➡️ Sincronizando apenas Site URL e Redirect URLs permitidas...");

              const urlsOnlyPayload = {
                site_url: siteUrl,
                uri_allow_list: `${siteUrl}/**,http://localhost:4200/**,http://127.0.0.1:4200/**`
              };

              const urlRes = await patchConfig(urlsOnlyPayload);
              if (urlRes.status >= 200 && urlRes.status < 300) {
                console.log("✅ Site URL e Redirect URLs sincronizados com sucesso!");
                return;
              } else {
                console.error(`❌ Falha ao sincronizar URLs: ${urlRes.status} - ${urlRes.body}`);
                process.exit(1);
              }
            }

            console.error(`❌ Erro na API do Supabase: ${res.status} - ${res.body}`);
            process.exit(1);
          }

          run().catch((err) => {
            console.error("❌ Erro inesperado:", err);
            process.exit(1);
          });
          '



