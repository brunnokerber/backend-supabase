name: Supabase CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate-local-stack:
    name: Validate local Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Start local Supabase stack
        run: supabase start --yes

      - name: Reset local database with migrations and seed
        run: supabase db reset --yes
